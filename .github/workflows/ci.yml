name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, feat-*]
  pull_request:
    branches: [main, develop]

jobs:
  test-solana:
    name: Test Solana Programs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          
      - name: Install Solana
        run: |
          sh -c "$(curl -sSfL https://release.solana.com/v1.16.0/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
          
      - name: Install Anchor
        run: |
          cargo install --git https://github.com/coral-xyz/anchor --tag v0.29.0 anchor-cli --locked
          
      - name: Build programs
        working-directory: ./solana-program
        run: anchor build
        
      - name: Run tests
        working-directory: ./solana-program
        run: anchor test

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Install dependencies
        working-directory: ./backend
        run: npm ci
        
      - name: Run linter
        working-directory: ./backend
        run: npm run lint
        
      - name: Run tests
        working-directory: ./backend
        run: npm test

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
        
      - name: Run linter
        working-directory: ./frontend
        run: npm run lint
        
      - name: Build
        working-directory: ./frontend
        run: npm run build

  test-orchestrator:
    name: Test Task Orchestrator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Install dependencies
        working-directory: ./task-orchestrator
        run: npm ci
        
      - name: Run tests
        working-directory: ./task-orchestrator
        run: npm test

  test-trading-data-feed:
    name: Test Trading Data Feed Access
    runs-on: ubuntu-latest
    env:
      HTTP_PROXY: ${{ secrets.HTTP_PROXY }}
      HTTPS_PROXY: ${{ secrets.HTTPS_PROXY }}
      NO_PROXY: ${{ secrets.NO_PROXY }}
    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install trading dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas pyarrow structlog yfinance

      - name: Check Yahoo DNS and egress
        run: |
          python - <<'PY'
          import socket
          import urllib.request

          hosts = [
              "finance.yahoo.com",
              "query1.finance.yahoo.com",
              "query2.finance.yahoo.com",
              "guce.yahoo.com",
          ]

          for host in hosts:
              try:
                  socket.gethostbyname(host)
              except OSError as exc:
                  raise SystemExit(
                      f"❌ Yahoo DNS/egress blocked for {host}: {exc}. "
                      "Configure runner proxy/allowlist (HTTP_PROXY/HTTPS_PROXY/NO_PROXY)."
                  )

          url = "https://query1.finance.yahoo.com/v8/finance/chart/GC=F?interval=1d&range=5d"
          req = urllib.request.Request(url, method="GET")
          try:
              with urllib.request.urlopen(req, timeout=10) as resp:
                  if int(resp.status) >= 400:
                      raise SystemExit(
                          f"❌ Yahoo endpoint returned HTTP {resp.status}. "
                          "Check proxy allowlist and outbound HTTPS."
                      )
          except Exception as exc:
              raise SystemExit(
                  f"❌ Yahoo HTTPS egress blocked: {exc}. "
                  "Configure runner proxy/allowlist (HTTP_PROXY/HTTPS_PROXY/NO_PROXY)."
              )
          print("✅ Yahoo DNS and HTTPS checks passed.")
          PY

      - name: Smoke test yfinance fetch
        run: |
          python - <<'PY'
          import yfinance as yf

          df = yf.download(
              "GC=F",
              period="5d",
              interval="1h",
              progress=False,
              auto_adjust=True,
              multi_level_index=False,
          )
          if df is None or df.empty:
              raise SystemExit("❌ yfinance returned empty data for GC=F.")
          print(f"✅ yfinance rows: {len(df)}")
          PY

  deploy-devnet:
    name: Deploy to Devnet
    needs: [test-solana, test-backend, test-frontend, test-orchestrator, test-trading-data-feed]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v3
      
      - name: Deploy Solana Programs
        run: echo "Deploying to Solana Devnet..."
        
      - name: Deploy Backend
        run: echo "Deploying backend to staging..."
        
      - name: Deploy Frontend
        run: echo "Deploying frontend to staging..."
